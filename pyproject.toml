[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-factor-research"
version = "0.2.0"
description = "Reproducible crypto cross-sectional factor research and continuous execution simulation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb",
    "httpx",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "pydantic",
    "scipy",
    "statsmodels",
    "tenacity",
]

[project.scripts]
momentum-research = "momentum_data.cli:main"

[project.optional-dependencies]
research = ["nautilus-trader==1.231.0", "lightgbm==4.7.0", "shap==0.54.1", "matplotlib", "ipykernel", "jupyterlab", "nbformat", "nbclient"]
dev = ["mypy", "pre-commit", "pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
